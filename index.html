<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>In Cadence | Veteran Access Platform</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    .mapboxgl-ctrl-bottom-left, .mapboxgl-ctrl-bottom-right {
      transform: scale(0.7);
      transform-origin: bottom left;
      left: 6px !important;
      bottom: 2px !important;
      right: auto !important;
    }
    .radar-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] w-screen overflow-hidden flex flex-col justify-between antialiased selection:bg-emerald-500 selection:text-slate-950 select-none">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur px-3 py-2 shrink-0 z-50">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-6 h-6 rounded bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
        </div>
        <div>
          <span class="font-extrabold tracking-wider text-xs uppercase text-slate-100 leading-none block">In Cadence</span>
          <span class="text-[8px] text-emerald-400 font-mono-code tracking-wide block mt-0.5">FORWARD MARCH TRANSIT // ALL-VISN</span>
        </div>
      </div>

      <div class="flex items-center space-x-1.5 px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-[8px] font-medium text-slate-300">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Zero-PII</span>
      </div>
    </div>
  </header>

  <!-- Main Viewport Dashboard (Flex Column Auto-Fitted) -->
  <main class="flex-1 max-w-md mx-auto w-full px-3 py-2 flex flex-col gap-2 min-h-0">

    <!-- Compact ZIP & Geolocation Input Row -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-lg p-2 shrink-0 shadow-sm">
      <div class="flex items-center justify-between mb-1">
        <label for="zipInput" class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400">
          Postal Code / Auto-GPS
        </label>
        <span id="matchStatus" class="text-[9px] font-mono-code text-slate-500">Live Auto-Lookup</span>
      </div>

      <div class="flex space-x-1.5">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="zipInput" 
            pattern="[0-9]*" 
            inputmode="numeric" 
            maxlength="5" 
            placeholder="5-digit ZIP..."
            class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-md px-2.5 py-1.5 text-xs text-slate-100 placeholder-slate-500 font-mono-code transition outline-none"
          >
        </div>
        <button 
          id="geoBtn"
          title="Detect Current Location"
          class="bg-slate-800 hover:bg-slate-700 active:bg-slate-800 text-emerald-400 border border-emerald-500/30 font-bold px-2.5 py-1.5 rounded-md text-[10px] uppercase tracking-wider flex items-center space-x-1 transition shrink-0"
        >
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span id="geoBtnLabel">GPS</span>
        </button>
      </div>

      <div id="statusAlert" class="hidden text-[10px] py-1 px-2 mt-1 rounded bg-amber-500/10 border border-amber-500/20 text-amber-300"></div>
    </section>

    <!-- Tactical Target Map (Expands to Fill Available Screen Space) -->
    <section class="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden relative flex-1 min-h-[140px] max-h-[220px] shadow-sm flex flex-col">
      <div class="px-2.5 py-1 border-b border-slate-800/80 flex items-center justify-between bg-slate-950/70 shrink-0">
        <div class="flex items-center space-x-1.5">
          <i data-lucide="radar" class="w-3 h-3 text-emerald-400"></i>
          <span class="text-[10px] font-semibold uppercase tracking-wider text-slate-300">Target Location View</span>
        </div>
        <span id="mapCoordinates" class="text-[9px] font-mono-code text-slate-400">STANDBY // NO FIX</span>
      </div>
      
      <div class="relative w-full flex-1 bg-slate-950">
        <div id="map" class="w-full h-full"></div>

        <!-- Center Radar Reticle -->
        <div class="radar-crosshair w-28 h-28 rounded-full border border-emerald-500/20 pointer-events-none flex items-center justify-center">
          <div class="w-16 h-16 rounded-full border border-emerald-500/30 border-dashed animate-[spin_10s_linear_infinite]"></div>
        </div>

        <!-- Call Button Anchored to Bottom Right -->
        <div class="absolute bottom-2 right-2 pointer-events-none z-10">
          <a 
            id="centerCallBtn" 
            href="tel:4123603620,1" 
            class="pointer-events-auto shadow-lg shadow-emerald-500/40 bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 px-3 py-1.5 rounded-md font-extrabold uppercase tracking-wider flex items-center space-x-1.5 transition transform active:scale-95 border border-emerald-300/60"
          >
            <i data-lucide="phone-call" class="w-3.5 h-3.5 fill-slate-950"></i>
            <span id="centerCallText" class="text-[10px] font-mono-code tracking-wide">CALL TRANSIT HUB</span>
          </a>
        </div>
      </div>
    </section>

    <!-- Facility Result Micro-Card -->
    <section id="resultCard" class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 shrink-0 space-y-1.5 shadow-sm">
      <div class="flex items-center justify-between">
        <span id="hubBadge" class="text-[9px] font-mono-code font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 truncate max-w-[200px]">
          SW Pennsylvania Hub
        </span>
        <span id="visnBadge" class="text-[10px] text-slate-400 font-mono-code shrink-0">VISN 4</span>
      </div>

      <div>
        <h2 id="facilityName" class="text-xs font-bold text-slate-100 leading-tight truncate">
          VA Pittsburgh Healthcare System
        </h2>
        <p id="facilityAddress" class="text-[10px] text-slate-400 truncate">
          University Drive & H.J. Heinz Divisions
        </p>
      </div>

      <div class="py-1 px-2 rounded bg-slate-950/70 border border-slate-800 flex items-center justify-between">
        <div class="truncate mr-2">
          <div class="text-[8px] uppercase font-mono-code tracking-wider text-slate-400">Direct Travel Coordinator</div>
          <div id="facilityPhone" class="text-[11px] font-bold text-emerald-400 font-mono-code truncate">412-360-3620 (Press 1)</div>
        </div>
        <a 
          id="callBtn" 
          href="tel:4123603620,1" 
          class="bg-slate-800 hover:bg-slate-700 active:bg-slate-800 border border-emerald-500/40 text-emerald-400 px-2 py-1 rounded text-[9px] font-bold uppercase tracking-wider flex items-center space-x-1 shrink-0"
        >
          <i data-lucide="phone" class="w-2.5 h-2.5"></i>
          <span>Dial</span>
        </a>
      </div>
    </section>

    <!-- Streamlined Secondary Actions & Modal Trigger -->
    <div class="grid grid-cols-2 gap-1.5 shrink-0">
      <!-- Nationwide Dispatch Dial -->
      <a 
        href="tel:8555747292" 
        class="bg-slate-900 border border-slate-800 hover:border-emerald-500/40 p-2 rounded-lg flex items-center justify
