<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FORWARD MARCH | In Cadence</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    :root {
      --primary-cyan: #38bdf8;
      --tactical-blue: #0284c7;
      --glass-panel: rgba(15, 23, 42, 0.78);
      --glass-border: rgba(56, 189, 248, 0.35);
      --success-neon: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      color: var(--text-main);
    }

    /* 3D Map Core */
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1;
    }

    /* Floating Top Command Bar */
    .top-command-bar {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      z-index: 10;
      background: var(--glass-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--primary-cyan);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .brand-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .live-status-pill {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--success-neon);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success-neon);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success-neon);
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Center ZIP Command Controller */
    .search-controller {
      position: absolute;
      top: calc(max(16px, env(safe-area-inset-top)) + 74px);
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .zip-input-box {
      flex: 1;
      background: var(--glass-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 5px;
      outline: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .zip-input-box:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }

    .btn-lock-target {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: 1px solid var(--primary-cyan);
      border-radius: 12px;
      padding: 0 20px;
      height: 52px;
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
    }

    .btn-lock-target:active {
      transform: scale(0.97);
    }

    /* Slide-Up Tactical Dispatch Card */
    .dispatch-drawer {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      z-index: 10;
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 -8px 36px rgba(0, 0, 0, 0.7);
      display: none;
      animation: drawerSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes drawerSlideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: var(--primary-cyan);
      font-family: monospace;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 6px;
    }

    .facility-heading {
      font-size: 1.15rem;
      font-weight: 900;
      line-height: 1.25;
      color: #fff;
    }

    .facility-sub {
      font-size: 0.8rem;
      color: var(--primary-cyan);
      margin-top: 2px;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .btn-tactical-dial {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--success-neon);
      border: 1px solid #86efac;
      border-radius: 12px;
      padding: 16px;
      color: #052e16;
      text-decoration: none;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.45);
    }

    .btn-tactical-dial:active {
      transform: scale(0.98);
      background: #16a34a;
    }

    .call-instructions-box {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
      font-family: monospace;
    }

    /* Radar Target Crosshair Marker */
    .radar-crosshair {
      width: 48px;
      height: 48px;
      border: 2px solid var(--primary-cyan);
      border-radius: 50%;
      position: relative;
      animation: radarScan 1.6s infinite ease-out;
      box-shadow: 0 0 20px var(--primary-cyan);
    }

    .radar-crosshair::before, .radar-crosshair::after {
      content: '';
      position: absolute;
      background: var(--primary-cyan);
    }

    .radar-crosshair::before {
      top: 50%;
      left: -8px;
      right: -8px;
      height: 2px;
      transform: translateY(-50%);
    }

    .radar-crosshair::after {
      left: 50%;
      top: -8px;
      bottom: -8px;
      width: 2px;
      transform: translateX(-50%);
    }

    @keyframes radarScan {
      0% { transform: scale(0.85); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 0.35; }
      100% { transform: scale(0.85); opacity: 0.9; }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Map Engine -->
  <div id="map"></div>

  <!-- Floating Header HUD -->
  <div class="top-command-bar">
    <div>
      <div class="brand-title">FORWARD MARCH</div>
      <div class="brand-sub">In Cadence &bull; Beneficiary Transit</div>
    </div>
    <div class="live-status-pill">
      <div class="status-dot"></div>
      VISN 4 ONLINE
    </div>
  </div>

  <!-- Floating ZIP Input -->
  <div class="search-controller">
    <input type="text" id="zipInput" class="zip-input-box" placeholder="15120" maxlength="5" inputmode="numeric">
    <button class="btn-lock-target" onclick="executeOrbitalDescent()">Lock Target</button>
  </div>

  <!-- Slide-Up Tactical Drawer -->
  <div id="dispatchDrawer" class="dispatch-drawer">
    <div class="telemetry-row">
      <span id="telTargetCoordinates">GPS // 00.0000, 00.0000</span>
      <span>SECURE TRANSIT DESK</span>
    </div>
    <div class="facility-heading" id="targetFacilityName">--</div>
    <div class="facility-sub" id="targetFacilityLocation">--</div>
    <a href="#" id="dialActionBtn" class="btn-tactical-dial">
      📞 CONNECT <span id="targetPhoneNumber">--</span>
    </a>
    <div class="call-instructions-box" id="targetDialInstructions">
      Automated switchboard bypass configured.
    </div>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4M29iazA2Z2gycXA4N2pmbDZmangifQ.-g_vE53SD2WrJ6tFX7QHmA';

    // Start in low-earth orbit
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/satellite-streets-v12',
      center: [-77.6, 40.9],
      zoom: 3.8,
      pitch: 0,
      bearing: 0
    });

    let targetMarker = null;

    // Master Field-Audited VISN 4 Hubs
    const VISN4_HUBS = {
      "VAPHS": {
        facility: "VA Pittsburgh Healthcare System",
        location: "University Drive / H.J. Heinz Hub",
        gps: [-79.9598, 40.4445],
        displayNumber: "412-360-3620 (Press 1)",
        telUri: "tel:4123603620,1",
        instructions: "System will pause and auto-dial 1."
      },
      "BUTLER": {
        facility: "Butler VA Health Care System",
        location: "Butler, PA Regional Hub",
        gps: [-79.9554, 40.8687],
        displayNumber: "800-362-8262 Ext 2475",
        telUri: "tel:8003628262,2475",
        instructions: "System pauses and auto-dials Ext 2475."
      },
      "ERIE": {
        facility: "Erie VA Medical Center",
        location: "Erie, PA Regional Hub",
        gps: [-80.0526, 42.1065],
        displayNumber: "814-860-2973",
        telUri: "tel:8148602973",
        instructions: "Direct line to the Beneficiary Travel desk."
      },
      "LEBANON": {
        facility: "Lebanon VA Medical Center",
        location: "Lebanon, PA Regional Hub",
        gps: [-76.4024, 40.3106],
        displayNumber: "717-272-6621 Ext 5767",
        telUri: "tel:7172726621,5767",
        instructions: "System pauses and auto-dials Ext 5767."
      },
      "COATESVILLE": {
        facility: "Coatesville VA Medical Center",
        location: "Coatesville, PA Regional Hub",
        gps: [-75.8078, 40.0039],
        displayNumber: "610-384-7711 Ext 5008",
        telUri: "tel:6103847711,5008",
        instructions: "System pauses and auto-dials Ext 5008."
      },
      "ALTOONA": {
        facility: "James E. Van Zandt VAMC",
        location: "Altoona, PA Regional Hub",
        gps: [-78.3846, 40.4996],
        displayNumber: "814-943-8164 Ext 17383",
        telUri: "tel:8149438164,17383",
        instructions: "System pauses and auto-dials Ext 17383."
      },
      "WILKES_BARRE": {
        facility: "Wilkes-Barre VA Medical Center",
        location: "Wilkes-Barre, PA Regional Hub",
        gps: [-75.8457, 41.2523],
        displayNumber: "570-824-3521 Ext 27135",
        telUri: "tel:5708243521,27135",
        instructions: "System pauses and auto-dials Ext 27135."
      },
      "WILMINGTON": {
        facility: "Wilmington VA Medical Center",
        location: "Wilmington, DE & S. Jersey Hub",
        gps: [-75.6022, 39.7423],
        displayNumber: "302-994-2511 Ext 34797",
        telUri: "tel:3029942511,34797",
        instructions: "System pauses and auto-dials Ext 34797."
      },
      "PHILADELPHIA": {
        facility: "Corporal Michael J. Crescenz VAMC",
        location: "Philadelphia, PA Regional Hub",
        gps: [-75.1979, 39.9482],
        displayNumber: "215-823-5800 Ext 204441",
        telUri: "tel:2158235800,204441",
        instructions: "System pauses and auto-dials Ext 204441."
      },
      "NATIONAL": {
        facility: "VA National Beneficiary Travel Help Desk",
        location: "National Unassigned Line",
        gps: [-77.0369, 38.9072],
        displayNumber: "855-574-7292",
        telUri: "tel:8555747292",
        instructions: "Toll-free national dispatch fallback line."
      }
    };

    function executeOrbitalDescent() {
      const input = document.getElementById("zipInput").value.trim();
      if (input.length < 3) {
        alert("PLEASE ENTER VALID 5-DIGIT ZIP");
        return;
      }

      const prefix = parseInt(input.substring(0, 3), 10);
      let target = VISN4_HUBS.NATIONAL;

      if ([150, 151, 152, 153, 154, 156].includes(prefix)) {
        target = VISN4_HUBS.VAPHS;
      } else if ([160, 161, 162, 163].includes(prefix)) {
        target = VISN4_HUBS.BUTLER;
      } else if ([164, 165].includes(prefix)) {
        target = VISN4_HUBS.ERIE;
      } else if ([155, 157, 158, 159, 166, 168].includes(prefix)) {
        target = VISN4_HUBS.ALTOONA;
      } else if ([170, 171, 172, 173, 174, 175, 176, 178, 179].includes(prefix)) {
        target = VISN4_HUBS.LEBANON;
      } else if ([182, 183, 184, 185, 186, 187, 188].includes(prefix)) {
        target = VISN4_HUBS.WILKES_BARRE;
      } else if ([193, 194, 195, 196].includes(prefix)) {
        target = VISN4_HUBS.COATESVILLE;
      } else if ([189, 190, 191, 192].includes(prefix)) {
        target = VISN4_HUBS.PHILADELPHIA;
      } else if ([197, 198, 199, 80, 81, 82, 83, 84].includes(prefix)) {
        target = VISN4_HUBS.WILMINGTON;
      }

      // Populate Telemetry Drawer
      document.getElementById("targetFacilityName").textContent = target.facility;
      document.getElementById("targetFacilityLocation").textContent = target.location;
      document.getElementById("targetPhoneNumber").textContent = target.displayNumber;
      document.getElementById("dialActionBtn").setAttribute("href", target.telUri);
      document.getElementById("targetDialInstructions").textContent = target.instructions;
      document.getElementById("telTargetCoordinates").textContent = `LAT: ${target.gps[1].toFixed(4)} // LNG: ${target.gps[0].toFixed(4)}`;
      document.getElementById("dispatchDrawer").style.display = "block";

      // Drop Pulsing Crosshair
      if (targetMarker) targetMarker.remove();

      const crosshairEl = document.createElement('div');
      crosshairEl.className = 'radar-crosshair';

      targetMarker = new mapboxgl.Marker(crosshairEl)
        .setLngLat(target.gps)
        .addTo(map);

      // Orbital Descent Fly-In
      map.flyTo({
        center: target.gps,
        zoom: 15.5,
        pitch: 65,
        bearing: 35,
        speed: 1.25,
        curve: 1.4,
        essential: true
      });
    }

    document.getElementById("zipInput").addEventListener("keyup", function(e) {
      if (e.key === "Enter") executeOrbitalDescent();
    });
  </script>
</body>
</html>
