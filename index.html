<!-- SATELLITE TACTICAL ORBIT & DESCENT MODULE -->
<div class="w-full max-w-xl mx-auto px-4 py-3">

  <!-- Map Container with HUD Scanner Framing -->
  <div class="relative w-full h-80 sm:h-96 rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 shadow-2xl">
    
    <!-- Real-Time Mapbox Canvas -->
    <div id="orbitMap" class="w-full h-full"></div>

    <!-- Outer-Space Orbital Grid Overlay & Corner Reticles -->
    <div class="pointer-events-none absolute inset-0 border border-emerald-500/20 rounded-2xl">
      <!-- Top Left Reticle -->
      <div class="absolute top-2 left-2 flex items-center space-x-1.5 text-[9px] font-mono-code text-emerald-400 bg-slate-950/80 px-2 py-0.5 rounded border border-emerald-500/30">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="hudStatus">SAT-LINK: GEO-ORBITAL STANDBY</span>
      </div>

      <!-- Top Right Telemetry -->
      <div id="hudTelemetry" class="absolute top-2 right-2 text-[9px] font-mono-code text-slate-400 bg-slate-950/80 px-2 py-0.5 rounded border border-slate-800">
        ALT: 35,786 KM // PITCH: 45°
      </div>

      <!-- Center Crosshairs (Active During Descent) -->
      <div id="crosshairTarget" class="hidden absolute inset-0 flex items-center justify-center">
        <div class="w-16 h-16 border border-emerald-400/40 rounded-full flex items-center justify-center animate-pulse">
          <div class="w-8 h-8 border border-emerald-400/80 rounded-full"></div>
          <div class="absolute w-20 h-[1px] bg-emerald-400/30"></div>
          <div class="absolute h-20 w-[1px] bg-emerald-400/30"></div>
        </div>
      </div>

      <!-- Bottom Status Bar -->
      <div class="absolute bottom-2 left-2 right-2 flex justify-between items-center text-[9px] font-mono-code text-slate-400 bg-slate-950/80 px-2.5 py-1 rounded border border-slate-800">
        <span id="hudTarget">SECTOR TARGET: UNASSIGNED</span>
        <span id="hudVISN">NETWORK CATCHMENT: PENDING</span>
      </div>
    </div>
  </div>

  <!-- ZIP Search Input -->
  <div class="mt-3 relative flex items-center">
    <input 
      id="tacticalZipInput"
      type="text" 
      maxlength="5" 
      inputmode="numeric" 
      pattern="[0-9]*"
      placeholder="Type 5-digit ZIP to initiate descent..." 
      class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 font-mono-code text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition pr-28"
    />
    <button 
      id="orbitLaunchBtn"
      type="button"
      onclick="handleDescentTrigger()" 
      class="absolute right-1.5 top-1.5 bottom-1.5 px-3 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-xs font-mono-code font-bold text-emerald-400 flex items-center space-x-1.5 transition active:scale-95">
      <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
      <span>Lock-In</span>
    </button>
  </div>

</div>

<!-- Include Mapbox GL JS & Stylesheet -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>

<script>
  // Replace with your public Mapbox Token (free tier handles up to 50k loads/month)
  mapboxgl.accessToken = 'YOUR_MAPBOX_PUBLIC_TOKEN_HERE';

  let map;
  const initialCoordinates = [-98.5795, 39.8283]; // Geographic Center of Continental US

  // Initialize Map in Deep Orbital View
  function initTacticalOrbit() {
    map = new mapboxgl.Map({
      container: 'orbitMap',
      style: 'mapbox://styles/mapbox/satellite-streets-v12', // Satellite view with road labels
      projection: 'globe', // High-fidelity curved planetary globe
      center: initialCoordinates,
      zoom: 1.5, // Outer Space / Earth Orbit altitude
      pitch: 45,
      bearing: 0,
      interactive: false // Lock touch interactions while in orbital lock
    });

    map.on('style.load', () => {
      // Atmospheric space glow styling
      map.setFog({
        color: 'rgb(10, 15, 30)', // Space background
        'high-color': 'rgb(16, 185, 129)', // Emerald atmosphere reflection
        'horizon-blend': 0.15,
        'space-color': 'rgb(2, 6, 23)',
        'star-intensity': 0.8
      });
    });
  }

  // Handle Input Detection
  document.getElementById('tacticalZipInput').addEventListener('input', (e) => {
    if (e.target.value.length === 5) {
      handleDescentTrigger();
    }
  });

  async function handleDescentTrigger() {
    const zip = document.getElementById('tacticalZipInput').value.trim();
    if (zip.length !== 5) return;

    const hudStatus = document.getElementById('hudStatus');
    const hudTelemetry = document.getElementById('hudTelemetry');
    const hudTarget = document.getElementById('hudTarget');
    const hudVISN = document.getElementById('hudVISN');
    const crosshair = document.getElementById('crosshairTarget');

    hudStatus.textContent = "DESCENT SEQUENCE ENGAGED";
    hudStatus.className = "text-[9px] font-mono-code text-amber-400 animate-pulse";
    hudTarget.textContent = `TARGET: ZIP ${zip}`;
    crosshair.classList.remove('hidden');

    try {
      // 1. Fetch geographic coordinates for the entered ZIP code via open-source geocoder
      const res = await fetch(`https://api.zippopotam.us/us/${zip}`);
      if (!res.ok) throw new Error('Invalid postal code');
      const data = await res.json();
      
      const lon = parseFloat(data.places[0].longitude);
      const lat = parseFloat(data.places[0].latitude);
      const placeName = `${data.places[0]['place name']}, ${data.places[0]['state abbreviation']}`;

      // 2. High-speed orbital fly-in descent curve
      hudTelemetry.textContent = "TRAJECTORY BURN // DECELERATING";

      map.flyTo({
        center: [lon, lat],
        zoom: 12.5, // Low-altitude tactical close-up
        pitch: 60,  // Tilted 3D perspective
        bearing: 25,
        speed: 1.2,  // Kinetic acceleration curve
        curve: 1.5,  // Deep orbital ballistic descent curve
        essential: true
      });

      map.once('moveend', () => {
        hudStatus.textContent = "TACTICAL LOCK ESTABLISHED";
        hudStatus.className = "text-[9px] font-mono-code text-emerald-400";
        hudTelemetry.textContent = `LAT: ${lat.toFixed(4)}° // LON: ${lon.toFixed(4)}°`;
        crosshair.classList.add('hidden');
        map.interactive = true; // Unlock touch controls on iPad

        // 3. Highlight ZIP center and VISN perimeter
        renderTacticalPerimeter(lon, lat, zip, placeName);
      });

    } catch (err) {
      hudStatus.textContent = "COORDINATE ERROR: FALLBACK READY";
      hudStatus.className = "text-[9px] font-mono-code text-red-400";
      crosshair.classList.add('hidden');
    }
  }

  // Draw the glowing tactical ZIP pinpoint and VISN vector boundary
  function renderTacticalPerimeter(lon, lat, zip, placeName) {
    // Clear existing marker layers
    if (map.getSource('target-point')) {
      map.removeLayer('target-glow');
      map.removeLayer('target-circle');
      map.removeSource('target-point');
    }

    // Add glowing circular tactical perimeter
    map.addSource('target-point', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [lon, lat] },
          properties: { title: zip }
        }]
      }
    });

    // Outer Radar Ring
    map.addLayer({
      id: 'target-glow',
      type: 'circle',
      source: 'target-point',
      paint: {
        'circle-radius': 30,
        'circle-color': '#10b981',
        'circle-opacity': 0.2,
        'circle-stroke-width': 1.5,
        'circle-stroke-color': '#34d399'
      }
    });

    // Center Tactical Bead
    map.addLayer({
      id: 'target-circle',
      type: 'circle',
      source: 'target-point',
      paint: {
        'circle-radius': 6,
        'circle-color': '#10b981',
        'circle-stroke-width': 2,
        'circle-stroke-color': '#ffffff'
      }
    });

    // Add Military HUD Popup over ZIP center
    new mapboxgl.Popup({ offset: 25, closeButton: false })
      .setLngLat([lon, lat])
      .setHTML(`
        <div style="background:#020617; color:#f8fafc; font-family:monospace; padding:6px 10px; border-radius:8px; border:1px solid #10b981;">
          <div style="font-size:12px; font-weight:bold; color:#34d399;">ZIP: ${zip}</div>
          <div style="font-size:10px; color:#94a3b8;">${placeName}</div>
        </div>
      `)
      .addTo(map);
  }

  // Initialize on page load
  window.addEventListener('DOMContentLoaded', initTacticalOrbit);
</script>
