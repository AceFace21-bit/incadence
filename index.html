<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>In Cadence | Forward March Transit Dispatch</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.92);
      --accent-blue: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --success-green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #020617;
      color: var(--text-main);
    }

    /* Fullscreen Satellite Map Background */
    #map {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Overlay Interface Container */
    .interface-overlay {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 32px 16px;
      pointer-events: none; /* Let touches hit the map when not on cards */
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      pointer-events: auto; /* Re-enable taps on the interface cards */
    }

    header {
      text-align: center;
      padding: 10px 0 4px 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 12px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .card {
      background-color: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      width: 100%;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 100%;
      background-color: #020617;
      border: 1px solid var(--border-color);
      color: #38bdf8;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      letter-spacing: 4px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button.btn-lookup {
      width: 100%;
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    button.btn-lookup:active {
      background-color: var(--accent-hover);
    }

    #dispatchResult {
      display: none;
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
      margin-top: 8px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .facility-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .facility-location {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .btn-dial {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--success-green);
      color: #052e16;
      text-decoration: none;
      font-weight: 800;
      font-size: 1.1rem;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
    }

    .btn-dial:active {
      opacity: 0.9;
    }

    .dial-instructions {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 10px;
      text-align: center;
      line-height: 1.4;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #283548;
      font-size: 0.88rem;
    }

    .checklist-item:last-child {
      border-bottom: none;
    }

    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-blue);
    }

    footer {
      text-align: center;
      padding: 12px 0 6px 0;
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Fullscreen 3D Map Container -->
  <div id="map"></div>

  <!-- Foreground App Container -->
  <div class="interface-overlay">
    <div class="container">
      <header>
        <h1>FORWARD MARCH</h1>
        <p>Beneficiary Travel Direct Dispatch</p>
      </header>

      <!-- Dispatch Lookup Card -->
      <div class="card">
        <div class="card-title">📍 Enter Patient ZIP Code</div>
        <div class="input-group">
          <input type="text" id="zipInput" placeholder="15201" maxlength="5" inputmode="numeric">
          <button class="btn-lookup" onclick="lookupTransitDesk()">Launch Direct Routing</button>
        </div>

        <div id="dispatchResult">
          <div class="facility-name" id="resFacility">--</div>
          <div class="facility-location" id="resLocation">--</div>
          <a href="#" id="resDialLink" class="btn-dial">
            📞 Call <span id="resPhone">--</span>
          </a>
          <div class="dial-instructions" id="resInstructions">
            Direct automated transfer configured.
          </div>
        </div>
      </div>

      <!-- Readiness Intake Card -->
      <div class="card">
        <div class="card-title">📋 Before You Call Checklist</div>
        <div class="checklist-item">
          <input type="checkbox" id="chk1">
          <label for="chk1">Full Legal Name & Last 4 of SSN</label>
        </div>
        <div class="checklist-item">
          <input type="checkbox" id="chk2">
          <label for="chk2">Clinic / Appointment Date & Exact Time</label>
        </div>
        <div class="checklist-item">
          <input type="checkbox" id="chk3">
          <label for="chk3">Specific Pickup Street Address Verified</label>
        </div>
        <div class="checklist-item">
          <input type="checkbox" id="chk4">
          <label for="chk4">Mobility Needs (Wheelchair / Walker / Escort)</label>
        </div>
      </div>

      <footer>
        VISN 4 Direct Network Verification &bull; In Cadence<br>
        Audited Field Directory &bull; Fast-Track Access
      </footer>
    </div>
  </div>
